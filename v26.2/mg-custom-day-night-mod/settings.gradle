pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    // Auto-provisions the Java 25 toolchain required by Minecraft 26.2
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'mg-custom-day-night-mod'
