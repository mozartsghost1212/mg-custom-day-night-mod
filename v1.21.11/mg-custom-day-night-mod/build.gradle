plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT' 
    id 'java'
    id 'maven-publish'
}

group = 'com.github.mozartsghost1212'
version = '2.0.5'

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.4:v2"
    modImplementation "net.fabricmc:fabric-loader:0.18.4"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.2+1.21.11"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

loom {
    runs {
        devServer {
            server()
            name = "Custom Day/Night Dev Server"
            runDir = "run/devServer"
            // Skip the EULA prompt so the server boots straight into a testable state.
            property "fabric.systemLibrariesFallback", "false"
        }
    }
}

// Ensure the dev server always has an accepted EULA and a server.properties before launch.
tasks.named("runDevServer") {
    doFirst {
        def runDir = file("run/devServer")
        runDir.mkdirs()

        def eula = new File(runDir, "eula.txt")
        eula.text = "# Auto-accepted by Gradle for local dev testing.\neula=true\n"

        def props = new File(runDir, "server.properties")
        if (!props.exists()) {
            props.text = [
                "# Auto-generated by Gradle for local dev testing.",
                "online-mode=false",
                "server-port=25565",
                "motd=Custom Day/Night Mod dev server",
                "max-players=8",
                "level-name=world",
                "gamemode=creative",
                "difficulty=peaceful",
                "spawn-protection=0",
                "enable-command-block=true",
                ""
            ].join("\n")
        }

        // Pass -PdevOp=YourName (comma-separated for multiple) to auto-op players at level 4.
        def opNames = (project.findProperty("devOp") ?: "").toString().trim()
        if (!opNames.isEmpty()) {
            def entries = opNames.split(",").collect { it.trim() }.findAll { !it.isEmpty() }.collect { name ->
                def bytes = ("OfflinePlayer:" + name).getBytes("UTF-8")
                def md5 = java.security.MessageDigest.getInstance("MD5").digest(bytes)
                // RFC 4122 v3 name-based UUID, matching Minecraft's offline-mode UUIDs.
                md5[6] = (byte) ((md5[6] & 0x0f) | 0x30)
                md5[8] = (byte) ((md5[8] & 0x3f) | 0x80)
                def bb = java.nio.ByteBuffer.wrap(md5)
                def uuid = new UUID(bb.long, bb.long).toString()
                """  {"uuid": "${uuid}", "name": "${name}", "level": 4, "bypassesPlayerLimit": true}"""
            }
            new File(runDir, "ops.json").text = "[\n" + entries.join(",\n") + "\n]\n"
        }
    }
}